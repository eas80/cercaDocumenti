services:
  - name: documentstore-backend
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DOCUMENTSTORE_CORS_ALLOWED_ORIGINS
        value: https://cercadocumenti.onrender.com
      # Also baked into the Dockerfile as a default (dashboard env vars were
      # not reliably reaching this service - see README.md), which is the
      # value actually in effect unless this one is confirmed working via
      # the startup "AUTH:" log line.
      - key: DOCUMENTSTORE_AUTH_USERS
        value: simona:simona,antonio:antonio
      # 32+ byte random string. Without it, tokens stay valid only until the
      # next restart (a new random signing key is generated each time).
      - key: DOCUMENTSTORE_JWT_SECRET
        sync: false

  - name: documentstore-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Also committed as frontend/.env.production, which Vite picks up
      # automatically — this just keeps the blueprint self-contained too.
      - key: VITE_API_BASE_URL
        value: https://cercadocumenti-be.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
