services:
  - name: documentstore-backend
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/documents
    envVars:
      - key: DOCUMENTSTORE_CORS_ALLOWED_ORIGINS
        value: https://cercadocumenti.onrender.com

  - name: documentstore-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Also committed as frontend/.env.production, which Vite picks up
      # automatically — this just keeps the blueprint self-contained too.
      - key: VITE_API_BASE_URL
        value: https://cercadocumenti-be.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
