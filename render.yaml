services:
  - name: documentstore-backend
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/documents
    envVars:
      # Set after the frontend's URL is known (see README.md) — required for
      # the browser to be allowed to call this API from the frontend's origin.
      - key: DOCUMENTSTORE_CORS_ALLOWED_ORIGINS
        sync: false

  - name: documentstore-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Also committed as frontend/.env.production, which Vite picks up
      # automatically — this just keeps the blueprint self-contained too.
      - key: VITE_API_BASE_URL
        value: https://cercadocumenti-be.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
