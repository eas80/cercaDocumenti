server:
  # Render (and most PaaS) injects the port to listen on via $PORT.
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

documentstore:
  storage:
    # disk (default, active today) | mongo (see README.md for migration steps)
    type: disk
    disk:
      directory: ./data/documents
  cors:
    # Comma-separated list of allowed origins for the frontend, e.g.
    # https://documentstore-frontend.onrender.com. Empty = no cross-origin
    # calls allowed (fine for local dev, where the Vite proxy avoids CORS).
    allowed-origins: ""
  auth:
    # Comma-separated username:password pairs, e.g. "alice:secret1,bob:secret2".
    # Empty = a single random-password "admin" account is generated at
    # startup and logged (see SecurityConfig) - fine for a quick try, not for
    # anything you actually want to keep private.
    users: ""
    jwt:
      # 32+ byte secret for signing tokens. Empty = a random key is generated
      # per process start (safe, but invalidates all sessions on every restart).
      secret: ""
      expiration-minutes: 120
