server:
  # Render (and most PaaS) injects the port to listen on via $PORT.
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

documentstore:
  storage:
    # disk (default, active today) | mongo (see README.md for migration steps)
    type: disk
    disk:
      directory: ./data/documents
  cors:
    # Comma-separated list of allowed origins for the frontend, e.g.
    # https://documentstore-frontend.onrender.com. Empty = no cross-origin
    # calls allowed (fine for local dev, where the Vite proxy avoids CORS).
    allowed-origins: ""
